name: datacenter-mgmt

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacenter_mgmt}
      POSTGRES_USER: ${POSTGRES_USER:-datacenter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./design/data-model/generated-mock-migration.sql:/docker-entrypoint-initdb.d/10-dcim.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    shm_size: 256mb
    stop_grace_period: 60s
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  app:
    image: ${APP_IMAGE:-datacenter-mgmt:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8008
      API_DATA_SOURCE: database
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-datacenter_mgmt}
      PGUSER: ${POSTGRES_USER:-datacenter}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      PGSCHEMA: dcim_ontology_demo_20260623083835
      CABINET_TELEMETRY_LOW_FREQUENCY_SECONDS: 60
      CABINET_TELEMETRY_HIGH_FREQUENCY_SECONDS: 2
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8008}:8008"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 30s
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data
